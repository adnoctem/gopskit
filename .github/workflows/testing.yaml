name: "Testing"

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: "${{ github.workflow }}@${{ github.event.pull_request.head.label || github.head_ref || github.ref }}"
  # Safe to cancel: unlike release.yaml, nothing here signs or publishes
  # anything, so a superseded run can be dropped without leaving state behind.
  cancel-in-progress: true

jobs:
  lint:
    name: Lint all code with 'pre-commit'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Set up golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.13

      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        with:
          extra_args: --all-files

  # One job per CLI, so their container tests - Vault, Keycloak, step-ca, k3s - run side by side, a
  # failure names the CLI it belongs to, and each job pulls only the images it needs. The last
  # partition, "shared", is everything the others don't claim - the pkg/ libraries and anything added
  # later - so a new package is tested even before it gets a partition of its own. A target in two
  # partitions merely runs twice; none can be left out.
  #
  # Every partition runs on every change: the CLIs build on the shared libraries, so a change in
  # pkg/ has to be tested against all of them.
  test:
    name: Test (${{ matrix.partition.name }})
    needs: [lint]
    strategy:
      # see every partition's result, not just the first failure
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        partition:
          - name: carto
            targets: //cmd/carto/... //internal/carto/...
          - name: plattr
            targets: //cmd/plattr/... //internal/plattr/...
          - name: ssolo
            targets: //cmd/ssolo/... //internal/ssolo/...
          - name: steppa
            targets: //cmd/steppa/... //internal/steppa/...
          - name: waltr
            targets: //cmd/waltr/... //internal/waltr/...
          - name: bridge
            targets: //cmd/gopskit-bridge/... //internal/bridgecmd/... //pkg/bridge/...
          - name: shared
            targets: >-
              //...
              -//cmd/carto/... -//internal/carto/...
              -//cmd/plattr/... -//internal/plattr/...
              -//cmd/ssolo/... -//internal/ssolo/...
              -//cmd/steppa/... -//internal/steppa/...
              -//cmd/waltr/... -//internal/waltr/...
              -//cmd/gopskit-bridge/... -//internal/bridgecmd/... -//pkg/bridge/...
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: read
    env:
      CACHE_PATH: ${{ matrix.os == 'macos-latest' && '/private/var/tmp/_bazel_runner/' || '~/.cache/bazel' }}
      TARGETS: ${{ matrix.partition.targets }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          # per partition: the jobs run at once and would otherwise race to save one cache
          disk-cache: ${{ github.workflow }}-${{ matrix.partition.name }}
          repository-cache: true

      - name: Cache Bazel
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.CACHE_PATH }}
          key: ${{ runner.os }}-bazel-${{ matrix.partition.name }}-${{ hashFiles('.bazelversion', '.bazelrc', 'WORKSPACE', 'MODULE.bazel') }}
          restore-keys: |
            ${{ runner.os }}-bazel-${{ matrix.partition.name }}-
            ${{ runner.os }}-bazel-

      # The patterns come through the environment rather than being templated into the script.
      # `--` lets the shared partition's subtracted patterns, which start with a dash, through.
      - name: Build Bazel artifacts
        run: |
          read -ra targets <<<"$TARGETS"
          bazel --output_user_root="$CACHE_PATH" build -- "${targets[@]}"

      - name: Test Bazel artifacts
        run: |
          read -ra targets <<<"$TARGETS"
          bazel --output_user_root="$CACHE_PATH" test \
            --@io_bazel_rules_go//go/config:race \
            --test_output=errors \
            -- "${targets[@]}"

  dispatch:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    needs: [lint, test]
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Dispatch a release workflow run
        # Release only after lint and every test partition succeeded. A matrix job's result is
        # "success" only when all of its jobs succeeded; checking for that, rather than for the
        # absence of "failure", also stops a release when a job was skipped or cancelled.
        # ref: https://github.com/actions/runner/issues/1251
        if: ${{ github.event_name == 'push' && needs.lint.result == 'success' && needs.test.result == 'success' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: "${{ env.GITHUB_TOKEN }}"
          script: |
            const payload = {
              run_id: "${{ github.run_id }}",
              sha: "${{ github.sha }}"
            }

            console.log("Sending event payload", JSON.stringify(payload, null, 2));

            const { owner, repo } = context.repo;
            await github.rest.repos.createDispatchEvent({
              owner,
              repo,
              event_type: 'release',
              client_payload: payload
            });
